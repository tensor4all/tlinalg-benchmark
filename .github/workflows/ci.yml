name: ci
on: [push, pull_request]
# The measurement itself runs locally: `scripts/record_run.py` builds, verifies and times the
# pinned checkout on the host that owns the numbers, and refuses to publish otherwise, so the
# harness's buildability is proven where it matters (and gated again in the source repository's
# own CI, which builds the harness target on every PR there). What is left for this repository is
# content: the declarations, every recorded manifest, and the generated index. That is one small
# job on the smallest runner, and it is the only required check on `main`.
#
# The tooling is no longer duplicated here: `requirements.txt` pins `campaign-toolkit`, and each
# `scripts/*.py` is a thin shim over its entry point.
jobs:
  link-preflight:
    # Its own job: the probe links with rustc and cc, which the ubuntu-slim index runner does not have.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Python deps
        run: python3 -m pip install --quiet -r requirements.txt
      - name: Link preflight declaration, and a hidden library fails
        # benchmarks/link-preflight.yaml is what record_run checks before every build. This runner has no
        # vendor libraries, so the mkl arm, with its prefix pointed at an empty directory, must fail and
        # name the library (the real pass is checked on the measurement host, at campaign start).
        run: |
          campaign-link-preflight --config benchmarks/link-preflight.yaml --validate
          empty="$(mktemp -d)"; mkdir -p "$empty/lib"
          if MKLROOT="$empty" MKL_THREADING_LIB="$empty/lib/libiomp5.so" campaign-link-preflight --config benchmarks/link-preflight.yaml \
              --arm mkl > /tmp/link-preflight-negative.txt; then
            echo "the link preflight passed with the mkl libraries hidden"; exit 1
          fi
          cat /tmp/link-preflight-negative.txt
          grep -q 'the linker cannot find libmkl_rt.so' /tmp/link-preflight-negative.txt

  index:
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # campaign-check-generated compares against origin/main
      - name: Python deps
        run: python3 -m pip install --quiet -r requirements.txt
      - name: Checkout the reference revision
        run: ./scripts/setup_extern_deps.sh
      - name: Declarations are well formed
        run: python3 -m campaign_toolkit.declarations
      - name: Every recorded run manifest validates
        run: |
          shopt -s nullglob
          files=(data/results/*/*/*/run.yaml)
          if [ ${#files[@]} -eq 0 ]; then echo "no runs recorded yet"; exit 0; fi
          python3 scripts/validate_run.py "${files[@]}"
      - name: Index is current, required cells present
        run: python3 scripts/gen_index.py --check
      - name: The pin has a current recording
        # Fails, with no exception, when pins/tlinalg-rs.rev names a revision no publication was
        # measured at, or when the newest publication was measured elsewhere: record at the pin, or
        # keep the pin at the last measured revision. gen_index --check runs the same rule.
        run: campaign-check-pin-recorded
      - name: Nothing generated was edited by hand
        # every published page is its run's report.md byte for byte, and the runs changed against
        # main regenerate their report.md from their CSVs (the index is checked by the step above)
        run: campaign-check-generated --base origin/main --no-index
      - name: Pins are the stack's
        run: campaign-sync-pins --check --repo tlinalg-benchmark

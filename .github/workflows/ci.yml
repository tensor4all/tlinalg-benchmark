name: ci
on: [push, pull_request]
jobs:
  index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Python deps
        run: python3 -m pip install --quiet -r requirements.txt
      - name: Checkout the reference revision
        run: ./scripts/setup_extern_deps.sh
      - name: Declarations are well formed
        run: |
          python3 - <<'PY'
          import json, yaml, jsonschema, pathlib
          root = pathlib.Path('.')
          run = json.loads((root/'schemas/benchmark-run.schema.json').read_text())
          suite = json.loads((root/'schemas/benchmark-suite.schema.json').read_text())
          jsonschema.Draft202012Validator.check_schema(run)
          jsonschema.Draft202012Validator.check_schema(suite)
          names = {p['name'] for p in yaml.safe_load((root/'benchmarks/profiles.yaml').read_text())['profiles']}
          for f in (root/'benchmarks/suites').glob('*.yaml'):
              data = yaml.safe_load(f.read_text())
              jsonschema.validate(data, suite)
              groups = set(data['family_groups'])
              for spec in data['runs']:
                  for population in spec['populations']:
                      unknown = set(population['groups']) - groups
                      assert not unknown, f'{f}: population names unknown groups {sorted(unknown)}'
              for p in data['required_profiles'] + data.get('optional_profiles', []):
                  assert p in names, f'{f}: unknown profile {p}'
          print('declarations ok')
          PY
      - name: Every recorded run manifest validates
        run: |
          shopt -s nullglob
          files=(data/results/*/*/*/run.yaml)
          if [ ${#files[@]} -eq 0 ]; then echo "no runs recorded yet"; exit 0; fi
          python3 scripts/validate_run.py "${files[@]}"
      - name: Index is current, required cells present
        run: python3 scripts/gen_index.py --check
  # The pin now names a revision that contains the harness, so a cell can be recorded from it. This
  # job proves that: it builds `tlbench` out of the pinned checkout, the same way the recorder does.
  # The vendor build is cached with the runner's CPU model in the key, because the from-source
  # OpenBLAS is produced by one machine and executed by whatever restores it.
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ runner.os }}-smoke
      - id: runner
        run: |
          echo "key=$(lscpu | sed -n 's/^Model name: *//p' | tr -d ' ')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: target/tlinalg-rev/*/release/build/openblas-src-*
          key: openblas-${{ runner.os }}-${{ runner.arch }}-${{ steps.runner.outputs.key }}-${{ hashFiles('pins/tlinalg-rs.rev') }}
      - run: ./scripts/setup_extern_deps.sh
      - name: The pinned harness builds
        run: CARGO_BUILD_JOBS=4 ./scripts/build_for_tlinalg_rev.sh "$PWD/extern/tlinalg-rs" /tmp/pin.env tlbench

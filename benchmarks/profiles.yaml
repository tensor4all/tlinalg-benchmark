# Hardware profiles. A profile is a machine (or a well-defined container on one)
# whose cells are only comparable with each other. Adding one is a deliberate
# act: an unknown profile in a run manifest is a schema error, not a warning.
schema_version: 1
profiles:
  - name: zen5-cpu
    description: >-
      AMD Ryzen AI 9 HX 470 (Zen5 mobile APU), 12 physical / 24 logical cores.
      Heterogeneous L3: CPUs 0-3 share 16 MiB, CPUs 4-11 share 8 MiB, so a
      thread set must be stated together with the domain it sits in. SMT
      siblings of CPUs 4-11 are 16-23; the idle gate checks them too, because a
      busy sibling contends with the physical core being measured.
    cpu: AMD Ryzen AI 9 HX 470
    logical_cpus: 24
    l3: "0-3: 16 MiB shared; 4-11: 8 MiB shared"

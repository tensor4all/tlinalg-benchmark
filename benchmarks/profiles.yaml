# Hardware profiles. A profile is a machine (or a well-defined container on one)
# whose cells are only comparable with each other. Adding one is a deliberate
# act: an unknown profile in a run manifest is a schema error, not a warning.
#
# The body of `zen5-cpu` lives in campaign-toolkit
# (`campaign_toolkit/profiles/zen5-cpu.yaml`): a profile is a fact about a
# machine, not about a campaign, so this repository *names* the profiles it
# measures. A profile only this campaign measures is still declared inline, as
# a mapping with the same fields.
schema_version: 1
profiles:
  - zen5-cpu
  # The measurement host (tensor4all-meta#76 D5), resolved against
  # `campaign_toolkit/profiles/zen2-cpu.yaml`. Every suite lists it as optional: it is
  # measured when the stack's versions move, not on the weekly schedule.
  - zen2-cpu

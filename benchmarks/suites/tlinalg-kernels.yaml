schema_version: 1
id: tlinalg-kernels
description: >-
  The batched kernel families of both providers, from one call per batch over a
  rank-2+B strided descriptor: the faer-backed `tlinalg` and the LAPACK/BLAS
  provider `tlinalg-blas`, the latter against the vendor build recorded in each
  manifest. Rows are declared as populations (regime x family group x shape
  grid x thread budget) rather than one Cartesian product, because a universal
  product over every family and shape is dominated by priming alone and the
  expensive families buy no extra information at every size.
# Only paths whose change can alter a measured result. Deliberately not
# `docs/**`: a README edit does not make a measurement stale, and a rule that
# could not tell the difference would be ignored in practice.
invalidated_by:
  - crates/tlinalg/**
  - crates/tlinalg-blas/**
  - crates/tlinalg-bench/**
  - crates/tlinalg-testkit/**
  - benchmarks/scripts/**
  - Cargo.toml
  - Cargo.lock
stale_after: 20
# One profile at a time, and a cell is not optional once it has been recorded: the
# first (zen5-cpu, tlinalg-kernels) cell exists, so this profile's absence is now an
# error rather than an empty cell.
required_profiles:
  - zen5-cpu
optional_profiles: []

# Family groups. A group is a set of families that are worth measuring on the
# same shape grid; the runs below say which groups are measured per regime. The
# provider rejects a shape it cannot take, and the harness emits that case as
# `skipped` so the coverage of a run stays visible in its own CSV.
family_groups:
  factor:
    - lu_factor
    - lu_solve_prepared
    - lu_factor_solve
    - solve
    - lu
    - cholesky
    - triangular_solve
    - svd_values
  decompose:
    - qr
    - rank_revealing_qr
    - svd_thin
    - eigh
    - eigvalsh
    - householder_factor
    - householder_apply
  heavy:
    - svd_full
    - eig
    - eigvals
    - full_piv_lu
    - full_piv_lu_solve
  rectangular:
    - svd_thin
    - qr
    - rank_revealing_qr
    - householder_factor

# What the workload is, in a form the result page can print.
workloads:
  name: batched dense kernels
  description: >-
    Square and rectangular dense matrices in a batch: one call per batch over a
    rank-2+B descriptor, `n x n` or `m x n` per item. Sizes are the matrix
    dimension, not a memory budget, so a case name says exactly what was
    factored; the batch extent is a separate axis and is never collapsed.
  source: >-
    The library's own kernel inventory (crates/tlinalg/src, crates/tlinalg-blas/src).
    Inputs are seeded from the case, so `verify` and `run` measure the same
    matrices and a rerun is reproducible.
  known_blind_spots:
    - "Only the kernel entry points are measured. Tensor construction, dtype dispatch, session entry and pool checkout are tenferro's and are out of scope."
    - "Batch extents are declared per regime, so a cost proportional to batch elements is visible only where the regime says so."
    - "The providers are compared at the thread budgets declared here; a budget the vendor threads itself by, outside that set, is not covered."
    - "A vendor arm records the vendor library, but only OpenBLAS reports the kernel its runtime dispatched to. MKL's manifest records its own version and the threading layer the harness pins; it names no kernel, because MKL exposes none to name."
    - "Each axis is sampled at two ends, not across it: n=8 in the small regime and n=64 in the medium regime are not measured, and neither is the batch between 1 and 1024. A cost that is only visible in the middle of a range is not covered here."

# One entry per engine name the harness emits. A result page explains every
# column from this, so a reader needs no context beyond the page.
engines_doc:
  faer-1lane:
    provider: tlinalg
    summary: >-
      The faer-backed provider on one sequential lane: the per-item cost plus the
      batch loop, with no threading at all. The overhead baseline.
    identity: tlinalg-rs (this repository's pinned revision)
  faer-pool:
    provider: tlinalg
    summary: >-
      The same provider on a host-owned Rayon pool of the row's thread budget,
      with the library choosing its batch lanes. The thread count is a column,
      not part of the row name.
    identity: tlinalg-rs (this repository's pinned revision)
    caveat: >-
      A faer count hint is not a hard active-thread limit; see the `Parallel`
      budget contract in tlinalg.
  lapack-openblas:
    provider: openblas
    summary: >-
      The LAPACK/BLAS provider: vendor calls and their marshalling, a serial
      batch loop, vendor-owned threading. The vendor's own thread budget is set
      by the harness before the row and read back, and the vendor identity and
      the kernel its runtime dispatched to are recorded in the manifest.
    identity: the OpenBLAS build recorded in this run's manifest (`providers[openblas]`)
    caveat: >-
      LAPACK and BLAS own their threading, so this row's thread budget is the
      vendor's, not the host pool's. Where a family has no LAPACK route the
      row is absent and the CSV says the case was skipped for it.
  lapack-mkl:
    provider: mkl
    summary: >-
      The same provider against Intel oneAPI MKL, linked from the installation
      `MKLROOT` names. One binary links one vendor library, so this row is
      measured by its own build of the harness and recorded as its own run; no
      page carries two vendor arms. The interface and threading layers are pinned
      by the harness before the first MKL call, because MKL otherwise lets the
      environment choose them and the interface layer is an ABI.
    identity: the MKL build recorded in this run's manifest (`providers[mkl]`)
    caveat: >-
      MKL reports no dispatched-kernel name and no processor count, so its
      manifest records neither rather than inferring them. Its threading is
      vendor-owned, as for OpenBLAS.

# Populations are sampled at the two ends of each axis rather than across it. Priming is a fixed
# 0.5 s per engine row per case and does not scale with the shape, so a middle point costs exactly
# what an end point costs while adding the least: batch=1 and batch=1024 are latency and throughput,
# and the batch between them is neither. Dropping the middle of each axis is what makes the whole
# declared grid affordable in one session; it is a declared reduction, not a silently partial run,
# and the shape grid below is the whole of what a full-coverage page must cover.
runs:
  - threads: [1, 4, 8]
    cpu_sets: ["4", "4-7", "4-11"]
    dtypes: [f64, c64]
    engines: [faer-1lane, faer-pool, lapack-openblas, lapack-mkl]
    populations:
      - regime: small
        groups: [factor, decompose, heavy]
        n: ["4", "8", "16"]
        batch: [1, 1024]
      - regime: medium
        groups: [factor, decompose]
        n: ["32", "128"]
        batch: [1, 128]
      - regime: large
        groups: [factor, decompose]
        n: ["256", "512"]
        batch: [1, 4]
      - regime: tall
        groups: [rectangular]
        n: ["1024x64", "4096x256"]
        batch: [1]
